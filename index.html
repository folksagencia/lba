<style>
  :root{
    --bg:#F7F4EC;--bg2:#EFEADD;--surface:#FFFFFF;--line:#E6DFCF;--line2:#D8CEB8;
    --verde:#173A27;--verde-m:#245239;--verde-c:#2F6B4A;--ink:#1D2A22;--texto:#4E5A52;--muted:#7A8178;
    --dourado:#C29A4B;--dourado-e:#9A7431;--wa:#1FA855;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --serif:'Playfair Display',Georgia,serif;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;background:var(--bg);}
  body{position:relative;min-height:100vh;min-height:100dvh;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(70% 40% at 100% 0%,rgba(194,154,75,.20),transparent 70%),
      radial-gradient(60% 40% at 0% 100%,rgba(47,107,74,.12),transparent 70%),
      var(--bg);}
  body::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;z-index:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse 70% 500px at 50% 180px,#000 10%,transparent 75%);
            mask-image:radial-gradient(ellipse 70% 500px at 50% 180px,#000 10%,transparent 75%);}
  a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent;}
  .wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:48px 20px calc(36px + env(safe-area-inset-bottom));}

  /* entrada */
  .in{animation:fadeUp .8s var(--ease) backwards;animation-delay:calc(.07s * var(--i,0) + .15s);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

  /* ===== PERFIL ===== */
  .perfil{text-align:center;margin-bottom:30px;}
  .avatar{width:112px;height:112px;margin:0 auto 20px;border-radius:50%;
    background:radial-gradient(120% 90% at 85% 10%,rgba(47,107,74,.95),transparent 60%),linear-gradient(160deg,#0F3A22,#06200F);
    display:flex;align-items:center;justify-content:center;position:relative;
    box-shadow:0 18px 40px rgba(23,58,39,.28),inset 0 1px 0 rgba(255,255,255,.08);}
  .avatar::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:1.5px solid rgba(194,154,75,.55);}
  .avatar img{width:68%;height:auto;display:block;}
  .nome{font-size:22px;font-weight:800;letter-spacing:-.025em;color:var(--verde);line-height:1.2;}
  .nome em{font-family:var(--serif);font-style:italic;font-weight:500;letter-spacing:0;color:var(--verde-c);}
  .handle{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:13.5px;font-weight:500;color:var(--muted);}
  .handle .ig{width:16px;height:16px;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .bio{margin:6px auto 0;font-size:16px;max-width:330px;font-size:15px;line-height:1.6;color:var(--texto);}

  /* ===== BOTÕES ===== */
  .links{display:flex;flex-direction:column;gap:12px;margin-bottom:40px;}
  .btn{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;min-height:68px;padding:12px 18px 12px 12px;
    border-radius:18px;font-size:15.5px;font-weight:700;letter-spacing:-.01em;
    transition:transform .35s var(--ease),box-shadow .35s var(--ease),background .25s ease,border-color .25s ease;}
  .btn .ic{flex-shrink:0;width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;}
  .btn .ic svg{width:22px;height:22px;}
  .btn .txt{flex:1;display:flex;flex-direction:column;gap:2px;text-align:left;}
  .btn .txt small{font-size:12.5px;font-weight:500;letter-spacing:0;opacity:.75;}
  .btn .go{width:20px;height:20px;flex-shrink:0;transition:transform .35s var(--ease);}
  @media (hover:hover){ .btn:hover{transform:translateY(-2px);} .btn:hover .go{transform:translateX(4px);} }
  .btn:active{transform:scale(.98);}

  .btn-wa{background:var(--verde);color:#fff;box-shadow:0 14px 30px rgba(23,58,39,.24);}
  .btn-wa .ic{background:var(--wa);color:#fff;}
  .btn-wa:hover{background:var(--verde-m);box-shadow:0 20px 38px rgba(23,58,39,.30);}
  .btn-wa::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-20deg);
    animation:shine 5s ease-in-out 2s infinite;}
  @keyframes shine{0%{left:-60%;}20%,100%{left:130%;}}
  .btn-wa .ic{position:relative;}
  .btn-wa .ic::before{content:'';position:absolute;inset:0;border-radius:13px;box-shadow:0 0 0 0 rgba(31,168,85,.6);animation:ping 2.2s ease-out infinite;}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(31,168,85,.5);}80%,100%{box-shadow:0 0 0 10px rgba(31,168,85,0);}}

  .btn-site{background:var(--surface);color:var(--verde);border:1px solid var(--line);box-shadow:0 1px 2px rgba(23,58,39,.05);}
  .btn-site .ic{background:rgba(47,107,74,.10);color:var(--verde-c);}
  .btn-site:hover{border-color:rgba(194,154,75,.6);box-shadow:0 16px 32px rgba(23,58,39,.10);}

  /* ===== CONTEÚDOS ===== */
  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .sec-head h2{font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--verde);}
  .sec-head h2 em{font-family:var(--serif);font-style:italic;font-weight:500;letter-spacing:0;color:var(--verde-c);}
  .sec-head a{font-size:12.5px;font-weight:600;color:var(--verde-c);display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
  .sec-head a .ig{width:15px;height:15px;}
  .sec-head a{padding:12px 0 12px 12px;margin:-12px 0;}
  @media (max-width:400px){ .btn{font-size:14.5px;gap:12px;padding-right:14px;} .btn .txt small{font-size:12px;} .btn .go{display:none;} .btn .ic{width:40px;height:40px;} }
  @media (max-width:340px){ .wrap{padding-left:14px;padding-right:14px;} .btn{font-size:14px;} .btn .txt small{font-size:11.5px;} .grid{gap:8px;} .grid .card{padding:12px;} .grid .card .tit{font-size:12.5px;} .grid .card .play{display:none;} }

  .filtros{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;}
  .filtros::-webkit-scrollbar{display:none;}
  .chip{min-height:38px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);flex-shrink:0;border:1px solid var(--line2);background:var(--surface);color:var(--texto);font:600 12.5px var(--sans);
    padding:8px 14px;border-radius:999px;cursor:pointer;transition:all .25s ease;}
  .chip[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:#fff;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .card{position:relative;aspect-ratio:4/5;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
    padding:14px;color:#fff;isolation:isolate;
    background:radial-gradient(120% 70% at 100% 0%,rgba(47,107,74,.95),transparent 62%),linear-gradient(160deg,#0F3A22,#06200F);
    box-shadow:0 10px 24px rgba(23,58,39,.16);transition:transform .45s var(--ease),box-shadow .45s var(--ease);}
  @media (hover:hover){ .card:hover{transform:translateY(-3px);box-shadow:0 18px 34px rgba(23,58,39,.22);} }
  .card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .8s var(--ease);}
  @media (hover:hover){ .card:hover img{transform:scale(1.05);} }
  .card::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,32,15,0) 35%,rgba(6,32,15,.88));}
  .card.sem-img::after{content:'';position:absolute;right:-30%;top:-12%;width:90%;aspect-ratio:1;border-radius:50%;z-index:-1;
    border:1px solid rgba(194,154,75,.35);box-shadow:0 0 0 18px rgba(194,154,75,.06),0 0 0 36px rgba(194,154,75,.04);}
  .badge{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22);
    font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;}
  .badge svg{width:11px;height:11px;}
  .card .play{position:absolute;top:50%;left:50%;width:46px;height:46px;margin:-34px 0 0 -23px;border-radius:50%;
    background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.35);
    display:flex;align-items:center;justify-content:center;transition:transform .4s var(--ease),background .3s ease;}
  .card .play svg{width:18px;height:18px;margin-left:2px;}
  @media (hover:hover){ .card:hover .play{transform:scale(1.1);background:var(--dourado);} }
  .card:active{transform:scale(.98);}
  .card .tit{font-size:13.5px;font-weight:700;line-height:1.3;letter-spacing:-.01em;text-wrap:balance;}
  .card .tema{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dourado);margin-bottom:5px;}

  .vazio{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px dashed var(--line2);border-radius:18px;padding:18px;color:var(--texto);font-size:14px;line-height:1.5;}
  .vazio .ic{flex-shrink:0;width:44px;height:44px;border-radius:13px;background:rgba(194,154,75,.14);color:var(--dourado-e);display:flex;align-items:center;justify-content:center;}
  .vazio .ic svg{width:26px;height:26px;}
  .vazio b{color:var(--verde);}

  footer{margin-top:40px;text-align:center;font-size:12px;color:var(--muted);}

  /* ===== VERSÃO ESCURA ===== */
  .escuro .bg::after{background:
    radial-gradient(70% 38% at 50% 12%,rgba(194,154,75,.20),transparent 70%),
    linear-gradient(180deg,rgba(6,28,15,.30) 0%,rgba(6,28,15,.62) 38%,rgba(5,24,13,.90) 100%);}
  .escuro{color:#F7F2E1;}
  .escuro .nome{color:#F7F2E1;text-shadow:0 2px 18px rgba(0,0,0,.45);}
  .escuro .nome em{color:var(--dourado);}
  .escuro .handle{color:rgba(241,235,212,.70);}
  .escuro .bio{color:rgba(241,235,212,.88);text-shadow:0 1px 12px rgba(0,0,0,.5);}
  .escuro .avatar{box-shadow:0 22px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1);}
  .escuro .avatar::after{border-color:rgba(194,154,75,.75);}
  .escuro .divisor{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px auto 0;color:var(--dourado);}
  .escuro .divisor::before,.escuro .divisor::after{content:'';width:42px;height:1px;background:linear-gradient(90deg,transparent,rgba(194,154,75,.8));}
  .escuro .divisor::after{transform:scaleX(-1);}
  .escuro .btn-wa{background:#F7F2E1;color:var(--verde);box-shadow:0 18px 40px rgba(0,0,0,.35);}
  .escuro .btn-wa:hover{background:#fff;}
  .escuro .btn-wa .txt small{color:var(--verde-c);opacity:1;}
  .escuro .btn-wa::after{background:linear-gradient(100deg,transparent,rgba(194,154,75,.25),transparent);}
  .escuro .btn-site{color:#F7F2E1;box-shadow:none;}
  .escuro .btn-site .ic{background:rgba(194,154,75,.16);color:var(--dourado);}
  .escuro .btn-site:hover{border-color:rgba(194,154,75,.6);background:rgba(255,255,255,.11);box-shadow:0 16px 32px rgba(0,0,0,.25);}
  .escuro .sec-head h2{color:#F7F2E1;}
  .escuro .sec-head h2 em{color:var(--dourado);}
  .escuro .sec-head a{color:var(--dourado);}
  .escuro .chip{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:rgba(241,235,212,.85);}
  .escuro .chip[aria-pressed="true"]{background:var(--dourado);border-color:var(--dourado);color:var(--verde);}
  .escuro .vazio{color:rgba(241,235,212,.84);border-style:solid;}
  .escuro .vazio b{color:#F7F2E1;}
  .escuro .vazio .ic{background:rgba(255,255,255,.08);}
  .escuro .card{border:1px solid rgba(255,255,255,.12);box-shadow:0 14px 30px rgba(0,0,0,.35);}
  .escuro footer{color:rgba(241,235,212,.5);}

</style>

<script>
/* =====================================================================
   CONFIGURAÇÃO: edite só esta parte
   ===================================================================== */
var CONFIG = {
  whatsapp: '5585992465748',   // DDI + DDD + número, só dígitos
  mensagemWhatsapp: 'Olá! Vim pelo Instagram e gostaria de falar com a LBA Advocacia.',
  site: 'https://lbaadvocacia.com'
};

/* Conteúdos (posts do Instagram).
   - tipo: 'video' (Reels) ou 'carrossel' (cards)
   - url: link do post, ex.: https://www.instagram.com/reel/XXXX/ ou https://www.instagram.com/p/XXXX/
   - imagem: opcional. Caminho de uma imagem de capa (ex.: 'capas/iss-fixo.jpg' na mesma pasta do index.html).
             Sem imagem, o card aparece com o fundo verde da marca.
   - Itens sem url ficam ocultos. */
var CONTEUDOS = [
  { tipo:'video',     tema:'ISS',               titulo:'ISS fixo para sociedade limitada', url:'', imagem:'' },
  { tipo:'video',     tema:'Simples Nacional',  titulo:'Simples Nacional em 2027',          url:'', imagem:'' },
  { tipo:'carrossel', tema:'Reforma Tributária',titulo:'Créditos e benefícios na transição tributária', url:'', imagem:'' },
  { tipo:'carrossel', tema:'Reforma Tributária',titulo:'O novo mapa tributário',            url:'', imagem:'' }
];
/* ===================================================================== */

(function(){
  var wa = document.getElementById('link-whatsapp');
  wa.href = 'https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(CONFIG.mensagemWhatsapp);
  document.getElementById('link-site').href = CONFIG.site;

  var ICON = {
    video:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
    carrossel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="M19 7v10M22 9v6"/></svg>'
  };
  var NOME = {video:'Vídeo', carrossel:'Carrossel'};
  var esc = function(s){ return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
  var itens = CONTEUDOS.filter(function(c){ return /^https:\/\/(www\.)?instagram\.com\//.test(c.url||''); });
  var grid = document.getElementById('grid');
  var filtros = document.querySelector('.filtros');

  if (!itens.length){
    filtros.style.display='none';
    grid.style.display='block';
    grid.innerHTML = '<a class="vazio glass in" style="--i:6" href="https://www.instagram.com/lba_advocacia/" target="_blank" rel="noopener">'+
      '<span class="ic"><svg class="ig" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6.5" fill="url(#igGrad)"/><rect x="5.2" y="5.2" width="13.6" height="13.6" rx="4.2" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="3.3" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="16.4" cy="7.6" r="1.05" fill="#fff"/></svg></span>'+
      '<span>Veja nossos vídeos e conteúdos sobre <b>Direito Tributário</b> no Instagram.</span></a>';
    return;
  }

  var first=true;
  function render(f){
    grid.innerHTML = itens.filter(function(c){ return f==='todos' || c.tipo===f; }).map(function(c,i){
      var img = c.imagem ? '<img src="'+esc(c.imagem)+'" alt="" loading="lazy" />' : '';
      return '<a class="card in'+(c.imagem?'':' sem-img')+'" style="--i:'+(first?6+i:i)+'" href="'+esc(c.url)+'" target="_blank" rel="noopener" aria-label="'+esc(NOME[c.tipo]+': '+c.titulo)+'">'+
        img+'<span class="badge">'+ICON[c.tipo]+NOME[c.tipo]+'</span>'+
        (c.tipo==='video'?'<span class="play">'+ICON.video+'</span>':'')+
        (c.tema?'<span class="tema">'+esc(c.tema)+'</span>':'')+
        '<span class="tit">'+esc(c.titulo)+'</span></a>';
    }).join('');
  }
  var tipos = ['todos'].concat(['video','carrossel'].filter(function(t){ return itens.some(function(c){return c.tipo===t;}); }));
  if (tipos.length < 3){ filtros.style.display='none'; }
  filtros.innerHTML = tipos.map(function(t){
    return '<button class="chip" type="button" data-f="'+t+'" aria-pressed="'+(t==='todos')+'">'+(t==='todos'?'Todos':(t==='video'?'Vídeos':'Carrosséis'))+'</button>';
  }).join('');
  filtros.addEventListener('click',function(e){
    var b=e.target.closest('.chip'); if(!b) return;
    Array.prototype.forEach.call(filtros.children,function(x){ x.setAttribute('aria-pressed', x===b); });
    render(b.getAttribute('data-f'));
  });
  render('todos'); first=false;
})();
</script>
